<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151a22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chess"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Chess</title></head><body><main class="app"><header><div class="brand"><span class="brand-mark">♞</span><h1>Chess</h1></div><button id="settings" class="icon-button" aria-label="Settings">⚙</button></header><section class="player"><div><strong id="top-name">Computer</strong><p id="top-sub">Easy · Black</p></div><div class="clock" id="top-clock">∞</div></section><div id="board" class="board" aria-label="Chessboard"></div><section class="player"><div><strong id="bottom-name">You</strong><p id="bottom-sub">White</p></div><div class="clock" id="bottom-clock">∞</div></section><p id="status" class="status" aria-live="polite">White to move</p><section class="move-panel"><div class="move-title">Moves</div><div id="moves">No moves yet</div></section><button id="claim" class="claim" hidden>Claim draw</button><div class="actions"><button id="undo" class="secondary">↶ &nbsp; Undo</button><button id="new-game" class="primary">＋ &nbsp; New game</button></div><footer>Offline chess · Saved on this device</footer></main><dialog id="setup"><div class="dialog-content"><h2>New game</h2><label>Opponent<select id="mode"><option value="computer">Computer</option><option value="local">Two players · same device</option></select></label><label id="difficulty-wrap">Difficulty<select id="difficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><label id="color-wrap">Play as<select id="color"><option value="white">White</option><option value="black">Black</option><option value="random">Random</option></select></label><label>Time control<select id="time"><option value="0">Unlimited</option><option value="3">3 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select></label><div class="dialog-actions"><button id="cancel-setup" class="secondary">Cancel</button><button id="start-game" class="primary">Start game</button></div></div></dialog><dialog id="promotion"><div class="dialog-content"><h2>Promote pawn</h2><p>Choose a piece</p><div class="promote-actions"><button data-promote="q">♛<small>Queen</small></button><button data-promote="r">♜<small>Rook</small></button><button data-promote="b">♝<small>Bishop</small></button><button data-promote="n">♞<small>Knight</small></button></div></div></dialog><script type="module" src="./app.js"></script></body></html>
